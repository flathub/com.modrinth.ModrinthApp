id: com.modrinth.ModrinthApp

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

command: modrinth-app
finish-args:
  - --filesystem=xdg-download:ro # allow drag and drop from downloads
  - --filesystem=xdg-run/app/com.discordapp.Discord:create # allows for discord rpc (flatpak)
  - --filesystem=xdg-run/discord-ipc-0 # allows for discord rpc
  - --device-if=all:!has-input-device
  - --device=input
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
  - --env=MODRINTH_EXTERNAL_UPDATE_PROVIDER=1
  - --env=MODRINTH_APP_SOURCE=flatpak
  # VR: OpenXR/OpenVR runtime config
  - --filesystem=xdg-config/openxr:ro
  - --filesystem=xdg-config/openvr:ro
  # SteamVR (SteamOS)
  - --filesystem=/opt/steamvr:ro
  - --filesystem=xdg-run/xrservice-ipc
  # SteamVR (desktop Steam, Debian/Ubuntu Steam)
  - --filesystem=~/.local/share/Steam/steamapps/common/SteamVR:ro
  - --filesystem=~/.steam/debian-installation/steamapps/common/SteamVR:ro
  # WiVRn (Flatpak)
  - --filesystem=xdg-run/wivrn:ro
  - --filesystem=xdg-data/flatpak/app/io.github.wivrn.wivrn:ro
  - --filesystem=/var/lib/flatpak/app/io.github.wivrn.wivrn:ro
  # SteamVR needs shared memory
  - --device=shm
  # JVM hugepages support (-XX:+UseLargePages, -XX:+UseTransparentHugePages)
  - --filesystem=/sys/kernel/mm/hugepages:ro
  - --filesystem=/sys/kernel/mm/transparent_hugepage:ro
  # Importing instances from other launchers
  - --filesystem=xdg-data/PrismLauncher:ro
  - --filesystem=~/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher:ro
  - --filesystem=xdg-data/multimc:ro
  - --filesystem=xdg-data/MultiMC:ro
  - --filesystem=xdg-data/ATLauncher:ro
  - --filesystem=xdg-data/gdlauncher_next:ro
  - --filesystem=~/curseforge/minecraft:ro
  - --filesystem=xdg-documents/curseforge/minecraft:ro

rename-desktop-file: Modrinth App.desktop
rename-icon: ModrinthApp

modules:
  # For the in-game narrator
  - modules/flite/flite.yml

  # Used by TinyFileDialogs from LWJGL
  - modules/xprop/xprop.yml

  # Required for older versions of Minecraft
  - modules/xrandr.yml

  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  # Some controller mods require libusb (see https://github.com/isXander/Controlify/issues/31)
  # Indeed, it is already provided by the runtime

  # Helper script used to wrap instances with the proper configuration for dGPUs
  - name: prime-run
    buildsystem: simple
    build-commands:
      - install -Dm755 prime-run "$FLATPAK_DEST"/bin/prime-run
    sources:
      - type: file
        path: prime-run

  # Feral GameMode, so gamemoderun can be used as an instance wrapper command
  - name: gamemode
    buildsystem: meson
    config-opts:
      - -Dwith-sd-bus-provider=no-daemon
      - -Dwith-examples=false
    post-install:
      - install -Dm755 ../data/gamemoderun -t /app/bin
    sources:
      - type: archive
        dest-filename: gamemode.tar.gz
        url: https://api.github.com/repos/FeralInteractive/gamemode/tarball/1.8.2
        sha256: 2886d4ce543c78bd2a364316d5e7fd59ef06b71de63f896b37c6d3dc97658f60
        x-checker-data:
          type: json
          url: https://api.github.com/repos/FeralInteractive/gamemode/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
          timestamp-query: .published_at
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/libgamemodeauto.a

  # TODO: compile from source
  - name: modrinth-app
    buildsystem: simple
    build-commands:
      - chmod +x ModrinthApp.AppImage
      - ./ModrinthApp.AppImage --appimage-extract

      - |
        desktop-file-edit \
          --set-comment="Modrinth's game launcher" \
          --set-icon="$FLATPAK_ID" \
          --set-key="Exec" --set-value="modrinth-app" \
          --set-key="StartupNotify" --set-value="true" \
          --set-key="Categories" --set-value="Game;ActionGame;AdventureGame;Simulation;" \
          --set-key="Keywords" --set-value="game;minecraft;mc;" \
          --set-key="StartupWMClass" --set-value="$FLATPAK_ID" \
          "squashfs-root/usr/share/applications/Modrinth App.desktop"

      - mkdir -p "$FLATPAK_DEST"/{bin,share}
      - cp -r squashfs-root/usr/share/{applications,icons} "$FLATPAK_DEST"/share/
      - install -Dm755 squashfs-root/usr/bin/ModrinthApp "$FLATPAK_DEST"/bin/modrinth-app
      - install -Dm644 com.modrinth.ModrinthApp.metainfo.xml "$FLATPAK_DEST"/share/metainfo/com.modrinth.ModrinthApp.metainfo.xml

    sources:
      - type: file
        path: com.modrinth.ModrinthApp.metainfo.xml

      - type: file
        url: https://launcher-files.modrinth.com/versions/0.23.5/linux/Modrinth%20App_0.23.5_amd64.AppImage
        dest-filename: ModrinthApp.AppImage
        sha256: ad9131461d09e4f3dc0cb83a17645022b641976e53350a3c5d817165f4afcd28
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://launcher-files.modrinth.com/updates.json
          version-query: .version
          url-query: |
            "https://launcher-files.modrinth.com/versions/\($version)/linux/Modrinth%20App_\($version)_amd64.AppImage"

      - type: file
        url: https://launcher-files.modrinth.com/versions/0.23.5/linux/Modrinth%20App_0.23.5_aarch64.AppImage
        dest-filename: ModrinthApp.AppImage
        sha256: c39cf8628f6343fc10d0e0c36d9a9dd1a2954708b821dca2e34b056013b9fa11
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://launcher-files.modrinth.com/updates.json
          version-query: .version
          url-query: |
            "https://launcher-files.modrinth.com/versions/\($version)/linux/Modrinth%20App_\($version)_aarch64.AppImage"

  # Wrap the executable in a wrapper to run scripts before running it
  - name: wrapper
    buildsystem: simple
    build-commands:
      - mv $FLATPAK_DEST/bin/modrinth-app $FLATPAK_DEST/bin/modrinth-app-wrapped
      - install -Dm755 modrinth-app-wrapper.sh $FLATPAK_DEST/bin/modrinth-app
    sources:
      - type: file
        path: modrinth-app-wrapper.sh
